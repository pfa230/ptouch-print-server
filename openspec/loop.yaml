defaultBranch: main
worktrees: .worktrees
agents:
  codex: [loop-codex, -s, read-only]
  claude: [loop-claude, --model, opus, --permission-mode, auto]
  deepseek: [loop-jail, loop-opencode, -m, openrouter/deepseek/deepseek-v4.1-flash]
  mimo: [loop-jail, loop-opencode, -m, openrouter/xiaomi/mimo-v2.6-flash]
  glm: [loop-jail, loop-opencode, -m, openrouter/~z-ai/glm-flash-latest]
  muse-contrib: [loop-jail, loop-opencode, -m, meta/muse-spark-1.3-contributor]
roles:
  proposalReviewer: codex
  planReviser: claude
  implementer: claude
  implementationReviewer: codex
attempts:
  proposalReview: 3
  implementation: 3
checks:
  # The host lacks PAPPL, so only the hardware-free core builds here; the adapter builds and tests in the container.
  - cmake -S . -B build -DPTOUCH_CORE_ONLY=ON && cmake --build build && ctest --test-dir build --output-on-failure
  - openspec validate --all --strict --no-interactive
delivery: pr
