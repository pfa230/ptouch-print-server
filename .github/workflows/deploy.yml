name: deploy-image
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and test runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.deploy
          platforms: linux/amd64
          load: true
          tags: ptouch-deploy:check
      - name: Smoke - IPP jobs and isolated socket capture
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y --no-install-recommends cups-ipp-utils
          python3 scripts/smoke-image.py ptouch-deploy:check --model PT-2730
          python3 scripts/smoke-image.py ptouch-deploy:check --model PT-P710BT
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/pfa230/ptouch-print-server
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
      - name: Build + push (main)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.deploy
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
